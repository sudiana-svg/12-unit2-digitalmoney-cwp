<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TTS Interaktif: Preserving Our Environment</title>
<style>
  :root{
    --primary:#1b8a5a;
    --primary-dark:#0f6b43;
    --bg1:#e0f7ec;
    --bg2:#d0f0e0;
    --white-cell:#ffffff;
    --block-cell:#173226;
    --border:#2b6f52;
    --correct:#8fd19e;
    --wrong:#f6b8b0;
    --highlight:#fff3b0;
    --num-color:#0f6b43;
    --cell:28px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Trebuchet MS',Verdana,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:#1a3d2c;
  }
  .app{
    display:flex; flex-direction:column;
    height:100dvh; height:100vh;
    padding:8px 10px;
    gap:6px;
  }

  /* ===== HEADER ===== */
  header{
    display:flex; align-items:center; gap:12px;
    background:#ffffffcc; border-radius:12px;
    padding:6px 14px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
    flex-shrink:0;
    min-height:44px;
  }
  .title-block{ flex-shrink:0; }
  .title-block h1{ margin:0; font-size:1.05rem; color:var(--primary-dark); line-height:1.1; }
  .title-block .subtitle{ margin:0; font-size:0.68rem; color:#4a7d63; }

  .clue-slot{
    flex:1; min-width:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    background:#fff3b0; border-radius:10px; padding:4px 12px;
    font-size:0.8rem; font-weight:600; color:#5a4600;
    opacity:0; transform:translateY(-4px);
    transition:opacity 0.15s, transform 0.15s;
    pointer-events:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .clue-slot.show{ opacity:1; transform:translateY(0); }

  .credit{ flex-shrink:0; font-size:0.65rem; color:#5c8a72; font-style:italic; text-align:right; }

  /* ===== MAIN ===== */
  main{
    flex:1; min-height:0;
    display:flex; gap:10px;
  }

  .grid-wrap{
    flex:1; min-width:0; min-height:0;
    display:flex; align-items:center; justify-content:center;
    background:#ffffffcc; border-radius:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    overflow:hidden;
    padding:6px;
  }

  #grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--cell));
    grid-template-rows:repeat(var(--rows), var(--cell));
    gap:1px;
    background:var(--border);
    padding:3px;
    border-radius:8px;
  }
  .cell{ position:relative; background:var(--block-cell); width:var(--cell); height:var(--cell); border-radius:2px; }
  .cell.white{ background:var(--white-cell); }
  .cell.white input{
    width:100%; height:100%; border:none; text-align:center;
    font-weight:700; text-transform:uppercase; background:transparent;
    color:#0f3d28; border-radius:2px; outline:none; padding:0;
    font-size:calc(var(--cell) * 0.55);
  }
  .cell.white input:focus{ background:var(--highlight); }
  .cell.active-word input{ background:#e8f9ee; }
  .cell.correct input{ background:var(--correct) !important; color:#0a4d1f; }
  .cell.wrong input{ background:var(--wrong) !important; color:#7a1a10; }
  .cell .num{
    position:absolute; top:0; left:1px; font-size:calc(var(--cell) * 0.24);
    color:var(--num-color); font-weight:700; pointer-events:none; line-height:1;
  }
  .cell .mark{
    position:absolute; bottom:0px; right:1px; font-size:calc(var(--cell) * 0.32);
    font-weight:900; pointer-events:none; line-height:1;
  }
  .cell.correct .mark{ color:#1e7d3a; }
  .cell.wrong .mark{ color:#c62828; }

  @keyframes wordBlink{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.15; transform:scale(1.5); }
  }
  @keyframes cellFlash{
    0%,100%{ box-shadow:none; }
    50%{ box-shadow:0 0 0 2px #2ecc71 inset; }
  }
  .cell.word-celebrate{ animation:cellFlash 0.22s ease-in-out 4; }
  .cell.word-celebrate .mark{ animation:wordBlink 0.22s ease-in-out 4; }

  /* ===== SIDE PANEL ===== */
  .panel{
    width:min(30vw, 320px); flex-shrink:0;
    display:flex; flex-direction:column; gap:6px;
    min-height:0;
  }
  .clue-box{
    background:#ffffffcc; border-radius:12px; padding:8px 10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
    flex:1; min-height:0;
    display:flex; flex-direction:column;
  }
  .clue-box h2{
    margin:2px 0 4px; font-size:0.85rem; color:var(--primary-dark);
    border-bottom:2px dashed var(--primary); padding-bottom:3px; flex-shrink:0;
  }
  .clue-list{ overflow-y:auto; flex:1; min-height:0; }
  .clue{
    padding:4px 6px; border-radius:6px; cursor:pointer; margin-bottom:2px;
    font-size:0.7rem; line-height:1.25; transition:background 0.15s;
  }
  .clue:hover{ background:#eafaf0; }
  .clue.active{ background:var(--highlight); font-weight:700; }
  .clue b{ color:var(--primary-dark); margin-right:3px; }

  /* ===== ACTIONS ===== */
  .actions{
    display:flex; gap:10px; justify-content:center; flex-shrink:0;
  }
  button{
    padding:8px 20px; font-size:0.85rem; font-weight:700; color:#fff;
    border:none; border-radius:24px; cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); transition:transform 0.1s, background 0.2s;
  }
  .btn-check{ background:var(--primary); }
  .btn-check:hover{ background:var(--primary-dark); transform:translateY(-1px); }
  .btn-reset{ background:#7f9c8f; }
  .btn-reset:hover{ background:#5f7a6c; transform:translateY(-1px); }

  /* ===== OVERLAY ===== */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:18px; padding:26px 30px; text-align:center; max-width:300px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  .modal h2{ color:var(--primary-dark); margin-top:0; font-size:1.2rem; }
  .modal p{ color:#2f6b4f; font-size:0.9rem; }
  .modal button{ margin-top:8px; padding:8px 20px; border-radius:20px; background:var(--primary); color:#fff; font-weight:700; }

  @media (max-width:800px){
    main{ flex-direction:column; }
    .panel{ width:100%; flex-direction:row; max-height:38vh; }
    .clue-box{ font-size:0.65rem; }
    .credit{ display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title-block">
      <h1>🌱 TTS: Preserving Our Environment</h1>
      <p class="subtitle">Unit 2 · Bahasa Inggris Kelas XI</p>
    </div>
    <div class="clue-slot" id="clueSlot"></div>
    <div class="credit">Dibuat oleh:<br>I Wayan Sudiana — SMAN 2 Bangli</div>
  </header>

  <main>
    <div class="grid-wrap" id="gridWrap">
      <div id="grid"></div>
    </div>

    <div class="panel">
      <div class="clue-box">
        <h2>➡️ Across</h2>
        <div class="clue-list" id="acrossList"></div>
      </div>
      <div class="clue-box">
        <h2>⬇️ Down</h2>
        <div class="clue-list" id="downList"></div>
      </div>
    </div>
  </main>

  <div class="actions">
    <button class="btn-check" onclick="checkAnswers()">✅ Cek Jawaban</button>
    <button class="btn-reset" onclick="resetGrid()">🔄 Reset</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>🎉 Selamat! 🎉</h2>
    <p>Kamu berhasil menyelesaikan Teka-Teki Silang<br>Preserving Our Environment!</p>
    <button onclick="document.getElementById('overlay').classList.remove('show')">Tutup</button>
  </div>
</div>

<script>
// ====== DATA SOAL (20 soal, diekstrak dari Materi Ajar Unit 2 - 6 Pertemuan) ======
// Koordinat divalidasi otomatis: tanpa konflik huruf, tanpa kata saling menempel keliru
const words = [
  {num:1,  dir:'down',   row:0,  col:3,  answer:'PRESENT',        clue:'Simple ... tense, used consistently throughout a descriptive text'},
  {num:2,  dir:'down',   row:0,  col:19, answer:'DESCRIBE',       clue:"The writer's purpose that focuses objectively on sensory details (to ...)"},
  {num:3,  dir:'down',   row:1,  col:8,  answer:'ADJECTIVE',      clue:'A ... phrase = adverb + adjective, e.g. "extremely polluted"'},
  {num:4,  dir:'down',   row:1,  col:11, answer:'POLLUTED',       clue:'Adjective describing a place contaminated by waste, e.g. "extremely ..."'},
  {num:5,  dir:'across', row:1,  col:13, answer:'RECYCLE',        clue:'To process used materials into new products'},
  {num:6,  dir:'across', row:2,  col:2,  answer:'PERSUADE',       clue:"The writer's purpose that highlights a place's appeal to attract readers (to ...)"},
  {num:7,  dir:'down',   row:3,  col:13, answer:'INFORM',         clue:"The writer's purpose that presents facts/data neutrally (to ...)"},
  {num:8,  dir:'across', row:5,  col:0,  answer:'SOUND',          clue:'The sense of hearing; example vocabulary: chirping birds, rustling leaves'},
  {num:8,  dir:'down',   row:5,  col:0,  answer:'SMELL',          clue:'The sense of smelling; example vocabulary: fresh scent of grass'},
  {num:9,  dir:'down',   row:5,  col:6,  answer:'LANDFILL',       clue:'The final disposal site for domestic waste'},
  {num:10, dir:'down',   row:6,  col:15, answer:'IDENTIFICATION', clue:'The part of a descriptive text structure that introduces the object/place in general'},
  {num:11, dir:'down',   row:7,  col:2,  answer:'COMPOST',        clue:'Natural fertilizer produced from processing organic waste'},
  {num:12, dir:'across', row:7,  col:4,  answer:'NONBIODEGRADABLE', clue:'Materials that cannot decompose naturally within a short period, such as plastic and cans'},
  {num:13, dir:'across', row:10, col:11, answer:'CLUTTERED',      clue:'Adjective describing a room that is messy and full of untidy items'},
  {num:14, dir:'down',   row:11, col:4,  answer:'TOUCH',          clue:'The sense of feeling; example vocabulary: cool breeze, smooth wooden path'},
  {num:15, dir:'across', row:12, col:2,  answer:'SPOTLESS',       clue:'Adjective describing a place that is extremely clean, without a single stain, like Tukad Bindu after the clean-up'},
  {num:16, dir:'down',   row:12, col:8,  answer:'SIGHT',          clue:'The sense of seeing; example vocabulary: sparkling water, lush greenery'},
  {num:17, dir:'across', row:13, col:10, answer:'EXHIBITION',     clue:'The poster showcase event for the Green Spot project in Meeting 6 (Poster ...)'},
  {num:18, dir:'across', row:16, col:10, answer:'POLLUTION',      clue:'Environmental contamination caused by waste or harmful substances'},
  {num:19, dir:'across', row:18, col:9,  answer:'OVERFLOWING',    clue:'Adjective describing a trash bin that is full to the point of spilling over'}
];

const ROWS = 20, COLS = 20;
document.documentElement.style.setProperty('--rows', ROWS);
document.documentElement.style.setProperty('--cols', COLS);

// ====== BANGUN STRUKTUR GRID ======
let grid = [];
for(let r=0;r<ROWS;r++) grid.push(new Array(COLS).fill(null));

words.forEach(w=>{
  for(let i=0;i<w.answer.length;i++){
    const r = w.dir==='down' ? w.row+i : w.row;
    const c = w.dir==='across' ? w.col+i : w.col;
    if(!grid[r][c]) grid[r][c] = { letter:w.answer[i], wordIds:[], number:null };
    grid[r][c].wordIds.push({id:w.num, dir:w.dir, index:i});
  }
  if(!grid[w.row][w.col].number) grid[w.row][w.col].number = w.num;
});

// ====== BUILD DOM SEKALI SAJA (agar fokus/keyboard tidak pernah terganggu) ======
const gridEl = document.getElementById('grid');
const gridWrap = document.getElementById('gridWrap');
let inputsMap = {};

for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
    const cellData = grid[r][c];
    const cellDiv = document.createElement('div');
    cellDiv.classList.add('cell');
    if(cellData){
      cellDiv.classList.add('white');
      cellDiv.dataset.row = r;
      cellDiv.dataset.col = c;

      if(cellData.number){
        const num = document.createElement('span');
        num.classList.add('num');
        num.textContent = cellData.number;
        cellDiv.appendChild(num);
      }

      const mark = document.createElement('span');
      mark.classList.add('mark');
      cellDiv.appendChild(mark);

      const input = document.createElement('input');
      input.maxLength = 1;
      input.autocomplete = 'off';
      input.dataset.row = r;
      input.dataset.col = c;
      cellDiv.appendChild(input);
      inputsMap[r+'-'+c] = input;

      input.addEventListener('input', (e)=>{
        const val = e.target.value.replace(/[^a-zA-Z]/g,'').toUpperCase();
        e.target.value = val;
        cellDiv.classList.remove('correct','wrong');
        mark.textContent = '';
        if(val){
          if(val === cellData.letter){
            cellDiv.classList.add('correct');
            mark.textContent = '✓';
            playCorrect();
          } else {
            cellDiv.classList.add('wrong');
            mark.textContent = '✗';
            playWrong();
          }
          moveToNextCell(r,c);
          checkWordCompletion(r,c);
          checkAutoComplete();
        }
      });

      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Backspace' && !e.target.value) moveToPrevCell(r,c);
        else if(e.key === 'ArrowRight'){ focusCell(r,c+1); }
        else if(e.key === 'ArrowLeft'){ focusCell(r,c-1); }
        else if(e.key === 'ArrowDown'){ focusCell(r+1,c); }
        else if(e.key === 'ArrowUp'){ focusCell(r-1,c); }
      });

      input.addEventListener('focus', ()=>{ highlightActiveWord(r,c); showCluePopup(r,c); });
      input.addEventListener('blur', ()=>{
        setTimeout(()=>{
          if(!document.activeElement || document.activeElement.tagName !== 'INPUT') hideCluePopup();
        }, 30);
      });
    }
    gridEl.appendChild(cellDiv);
  }
}

// ====== RESPONSIVE: hanya ubah --cell via CSS variable, DOM tidak pernah dibangun ulang ======
function computeAndApplyCellSize(){
  const availW = gridWrap.clientWidth - 14;
  const availH = gridWrap.clientHeight - 14;
  let size = Math.floor(Math.min(availW / COLS, availH / ROWS));
  size = Math.max(10, size);
  document.documentElement.style.setProperty('--cell', size + 'px');
}

window.addEventListener('load', computeAndApplyCellSize);
window.addEventListener('resize', ()=>{
  clearTimeout(window._rsz);
  window._rsz = setTimeout(computeAndApplyCellSize, 150);
});
computeAndApplyCellSize();

// ====== NAVIGASI & HIGHLIGHT ======
function focusCell(r,c){ const inp = inputsMap[r+'-'+c]; if(inp) inp.focus(); }

let currentDirPreference = 'across';

function getWordAt(r,c,preferDir){
  const cellData = grid[r][c];
  let entry = cellData.wordIds.find(w=>w.dir===preferDir) || cellData.wordIds[0];
  return {entry, word: words.find(x=>x.num===entry.id && x.dir===entry.dir)};
}

function moveToNextCell(r,c){
  const {entry, word} = getWordAt(r,c,currentDirPreference);
  const nextIndex = entry.index+1;
  if(nextIndex < word.answer.length){
    const nr = word.dir==='down' ? word.row+nextIndex : word.row;
    const nc = word.dir==='across' ? word.col+nextIndex : word.col;
    focusCell(nr,nc);
  }
}

function moveToPrevCell(r,c){
  const {entry, word} = getWordAt(r,c,currentDirPreference);
  const prevIndex = entry.index-1;
  if(prevIndex >= 0){
    const pr = word.dir==='down' ? word.row+prevIndex : word.row;
    const pc = word.dir==='across' ? word.col+prevIndex : word.col;
    focusCell(pr,pc);
  }
}

function clearHighlights(){
  document.querySelectorAll('.cell.active-word').forEach(el=>el.classList.remove('active-word'));
  document.querySelectorAll('.clue.active').forEach(el=>el.classList.remove('active'));
}

function highlightActiveWord(r,c){
  clearHighlights();
  const {entry, word} = getWordAt(r,c,currentDirPreference);
  currentDirPreference = entry.dir;
  for(let i=0;i<word.answer.length;i++){
    const rr = word.dir==='down' ? word.row+i : word.row;
    const cc = word.dir==='across' ? word.col+i : word.col;
    const el = inputsMap[rr+'-'+cc];
    if(el) el.parentElement.classList.add('active-word');
  }
  const clueEl = document.querySelector(`.clue[data-num="${word.num}"][data-dir="${word.dir}"]`);
  if(clueEl) clueEl.classList.add('active');
}

// ====== POP-UP CLUE NON-BLOCKING (di header, tidak menutupi grid) ======
const clueSlot = document.getElementById('clueSlot');
function showCluePopup(r,c){
  const {word} = getWordAt(r,c,currentDirPreference);
  clueSlot.textContent = `${word.num}. ${word.clue}`;
  clueSlot.classList.add('show');
}
function hideCluePopup(){
  clueSlot.classList.remove('show');
}

// ====== RENDER PANEL PERTANYAAN ======
const acrossList = document.getElementById('acrossList');
const downList = document.getElementById('downList');

words.filter(w=>w.dir==='across').sort((a,b)=>a.num-b.num).forEach(w=>{
  const div = document.createElement('div');
  div.classList.add('clue');
  div.dataset.num = w.num;
  div.dataset.dir = 'across';
  div.innerHTML = `<b>${w.num}.</b>${w.clue} (${w.answer.length})`;
  div.addEventListener('click', ()=>{
    currentDirPreference = 'across';
    focusCell(w.row, w.col);
    highlightActiveWord(w.row, w.col);
    showCluePopup(w.row, w.col);
  });
  acrossList.appendChild(div);
});

words.filter(w=>w.dir==='down').sort((a,b)=>a.num-b.num).forEach(w=>{
  const div = document.createElement('div');
  div.classList.add('clue');
  div.dataset.num = w.num;
  div.dataset.dir = 'down';
  div.innerHTML = `<b>${w.num}.</b>${w.clue} (${w.answer.length})`;
  div.addEventListener('click', ()=>{
    currentDirPreference = 'down';
    focusCell(w.row, w.col);
    highlightActiveWord(w.row, w.col);
    showCluePopup(w.row, w.col);
  });
  downList.appendChild(div);
});

// ====== SUARA (Web Audio API, tanpa file eksternal) ======
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type){
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}
function playCorrect(){ playTone(880,0.13,'sine'); setTimeout(()=>playTone(1175,0.15,'sine'), 90); }
function playWrong(){ playTone(160,0.25,'square'); }
function playCelebrate(){
  [523,659,784,1046].forEach((f,i)=> setTimeout(()=>playTone(f,0.2,'sine'), i*130));
}
// Suara "gemerincing" (jingle/chime) saat satu KATA selesai dijawab dengan benar
function playJingle(){
  const notes = [1568,1976,2349,3136,2349];
  notes.forEach((f,i)=> setTimeout(()=>playTone(f,0.16,'triangle'), i*70));
}

// ====== DETEKSI KATA SELESAI (trigger gemerincing + kedip hijau) ======
const completedWords = new Set();
function wordKey(w){ return w.num + '-' + w.dir; }

function checkWordCompletion(r,c){
  const cellData = grid[r][c];
  cellData.wordIds.forEach(entry=>{
    const w = words.find(x=>x.num===entry.id && x.dir===entry.dir);
    const key = wordKey(w);
    if(completedWords.has(key)) return;
    let complete = true;
    for(let i=0;i<w.answer.length;i++){
      const rr = w.dir==='down' ? w.row+i : w.row;
      const cc = w.dir==='across' ? w.col+i : w.col;
      const inp = inputsMap[rr+'-'+cc];
      if(!inp || inp.value.toUpperCase() !== grid[rr][cc].letter){ complete = false; break; }
    }
    if(complete){
      completedWords.add(key);
      celebrateWord(w);
    }
  });
}

function celebrateWord(w){
  playJingle();
  const cells = [];
  for(let i=0;i<w.answer.length;i++){
    const rr = w.dir==='down' ? w.row+i : w.row;
    const cc = w.dir==='across' ? w.col+i : w.col;
    const el = inputsMap[rr+'-'+cc];
    if(el){ el.parentElement.classList.add('word-celebrate'); cells.push(el.parentElement); }
  }
  setTimeout(()=> cells.forEach(el=>el.classList.remove('word-celebrate')), 950);
}

// ====== CEK JAWABAN ======
function fullCheck(showMark){
  let allFilled = true;
  let allCorrect = true;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cellData = grid[r][c];
      if(!cellData) continue;
      const input = inputsMap[r+'-'+c];
      const cellDiv = input.parentElement;
      const mark = cellDiv.querySelector('.mark');
      const userVal = input.value.toUpperCase();
      if(!userVal){ allFilled = false; continue; }
      if(userVal === cellData.letter){
        if(showMark){ cellDiv.classList.remove('wrong'); cellDiv.classList.add('correct'); mark.textContent='✓'; }
      } else {
        allCorrect = false;
        if(showMark){ cellDiv.classList.remove('correct'); cellDiv.classList.add('wrong'); mark.textContent='✗'; }
      }
    }
  }
  return allFilled && allCorrect;
}

function checkAnswers(){
  const perfect = fullCheck(true);
  if(perfect){
    playCelebrate();
    document.getElementById('overlay').classList.add('show');
  }
}

function checkAutoComplete(){
  if(fullCheck(false)){
    playCelebrate();
    document.getElementById('overlay').classList.add('show');
  }
}

// ====== RESET GRID ======
function resetGrid(){
  Object.values(inputsMap).forEach(inp=>{
    inp.value = '';
    const cellDiv = inp.parentElement;
    cellDiv.classList.remove('correct','wrong','active-word','word-celebrate');
    const mark = cellDiv.querySelector('.mark');
    if(mark) mark.textContent = '';
  });
  completedWords.clear();
  hideCluePopup();
}
</script>
